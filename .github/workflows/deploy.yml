name: Deploy

# Every push to main tests, rebuilds and restarts the container on the self-hosted runner.
# Box-local files live in BOX (gitignored there): .env (app env, see self-host/config), data/, courses-private/,
# docker-compose.override.yml (joins Caddy's network).
# The runner label stays `questlog` until the host runner is relabelled (runbook in README).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  BOX: /home/cdominguez/Developer/questlog

jobs:
  deploy:
    runs-on: [self-hosted, questlog]
    steps:
      - uses: actions/checkout@v4
      - name: Private courses
        run: |
          git -C "$BOX/courses-private" pull --ff-only || true
          rm -rf courses-private && cp -a "$BOX/courses-private" courses-private
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - name: Build and restart
        env:
          DATA_DIR: ${{ env.BOX }}/data
          ENV_FILE: ${{ env.BOX }}/.env
          COMMIT: ${{ github.sha }}
        run: |
          # The project was called questlog before the rename; free its port first.
          docker compose -p questlog down --remove-orphans || true
          docker compose -f docker-compose.yml -f "$BOX/docker-compose.override.yml" up -d --build
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8790/api/health && exit 0
            sleep 2
          done
          docker logs --tail 50 questie
          exit 1
