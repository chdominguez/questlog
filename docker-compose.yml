# Self-hosted: `docker compose up -d --build`, then open http://127.0.0.1:8790.
# Put ANTHROPIC_API_KEY in .env for grading, and VAPID_PUBLIC/VAPID_PRIVATE/VAPID_SUBJECT (npx web-push generate-vapid-keys; subject mailto:you@host) for reminders. Login is the reverse proxy's job (see README).
name: questlog
services:
  app:
    build: .
    container_name: questlog
    restart: unless-stopped
    ports: ["127.0.0.1:8790:8787"]
    environment: { ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}", USER_HEADER: x-auth-request-email, VAPID_PUBLIC: "${VAPID_PUBLIC:-}", VAPID_PRIVATE: "${VAPID_PRIVATE:-}", VAPID_SUBJECT: "${VAPID_SUBJECT:-}", NAME_HEADER: x-auth-request-preferred-username } # header Caddy copies from oauth2-proxy
    volumes: ["${DATA_DIR:-./data}:/data"]
