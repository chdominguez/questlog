# Self-hosted: put APP_URL and BETTER_AUTH_SECRET in .env, then `docker compose up -d --build`. Env reference: questie.app/self-host/config/
name: questie
services:
  app:
    build: { context: ., args: { COMMIT: "${COMMIT:-dev}" } }
    container_name: questie
    restart: unless-stopped
    ports: ["127.0.0.1:8790:8787"]
    env_file: [{ path: "${ENV_FILE:-.env}", required: false }]
    volumes: ["${DATA_DIR:-./data}:/data"]
